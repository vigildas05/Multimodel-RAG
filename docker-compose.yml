services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      # Ollama runs on the HOST (not in Compose) since GPU passthrough into a Windows/Mac
      # Docker container is unnecessary friction for a local model server. The backend
      # reaches it via the Docker-provided host gateway alias.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
