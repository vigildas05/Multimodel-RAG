name: red-team

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  redteam:
    name: Red-team suite (mocked LLM, heuristics)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Fail the build if the attack success rate with the gateway ON, or the benign
      # false-positive rate, rises above these. Override with repository variables.
      REDTEAM_MAX_ASR: ${{ vars.REDTEAM_MAX_ASR || '0.28' }}
      REDTEAM_MAX_FPR: ${{ vars.REDTEAM_MAX_FPR || '0.02' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The gateway's heuristic layers and the harness need only the standard library.
      - name: Install test runner
        run: pip install pytest==8.3.4

      - name: Harness tests
        run: pytest -q redteam/tests

      - name: Red-team evaluation (gate)
        run: >
          python redteam/run_eval.py
          --classifier off
          --name ci
          --out-dir redteam/reports/ci
          --max-asr "$REDTEAM_MAX_ASR"
          --max-fpr "$REDTEAM_MAX_FPR"

      - name: Add report to job summary
        if: always()
        run: cat redteam/reports/ci/ci.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: redteam-report
          path: redteam/reports/ci/
